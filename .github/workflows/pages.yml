name: Publish research notebook

on:
  push:
    branches: [main]
    paths:
      - index.html
      - notebook.html
      - server.py
      - LICENSES/MIT.txt
      - tools/build_pages.py
      - tests/test_pages.py
      - tests/test_pages_client.js
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Test the static notebook build
        run: python3 -m unittest discover -s tests -p 'test_pages.py'
      - name: Build the public notebook
        env:
          SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: python3 tools/build_pages.py --out _site --source-url "$SOURCE_REPOSITORY"
      - name: Test published update behavior
        run: node tests/test_pages_client.js _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy notebook
        id: deployment
        uses: actions/deploy-pages@v4
