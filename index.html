<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noemesis · Research notebook</title>
  <style>
    :root { color-scheme: light; --paper: #fffefb; --ink: #232e32; --muted: #65716d; --accent: #247462; --notebook-width: 940px; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f1f3ee; color: var(--ink); font: 18px/1.75 Georgia, 'Times New Roman', serif; }
    .toolbar { max-width: 1000px; margin: auto; padding: 24px 32px; display: flex; justify-content: space-between; align-items: center; gap: 16px; font: 13px/1.5 system-ui, sans-serif; color: var(--muted); }
    .brand { color: var(--accent); font-weight: 650; letter-spacing: .12em; text-transform: uppercase; }
    #status::before { content: '●'; margin-right: 8px; color: var(--accent); }
    #status[data-error]::before { color: #b77324; }
    #update-notice { position: fixed; z-index: 10; left: max(12px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom)); padding: 6px 14px; border: 1px solid #c8d8ce; border-radius: 999px; background: var(--paper); color: var(--accent); font: 13px/1.5 system-ui, sans-serif; box-shadow: 0 2px 8px #23372826; cursor: pointer; }
    #update-notice[hidden] { display: none; }
    #update-notice:hover { background: #eef5ef; }
    #update-notice:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    main { max-width: var(--notebook-width); margin: 0 auto 64px; padding: 56px 70px; background: var(--paper); border: 1px solid #dde2d9; border-radius: 8px; box-shadow: 0 12px 40px #23372806; overflow-wrap: anywhere; }
    h1, h2, h3 { line-height: 1.25; font-weight: 500; }
    h1 { font-size: clamp(32px, 5vw, 46px); margin: 0 0 20px; letter-spacing: -.035em; }
    h2 { font-size: 27px; margin: 0 0 18px; }
    p { margin: 16px 0; }
    .intro { color: var(--muted); font-size: 20px; max-width: 650px; }
    .eyebrow { color: var(--accent); font: 12px/1.5 system-ui, sans-serif; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 12px; }
    section { border-top: 1px solid #e2e5dd; margin-top: 42px; padding-top: 32px; }
    .result { border-left: 3px solid var(--accent); background: #eef5ef; padding: 12px 22px; margin: 24px 0; }
    .math { overflow-x: auto; padding: 4px 0; }
    main table { display: block; max-width: 100%; overflow-x: auto; overflow-y: hidden; }
    main table th, main table td { overflow-wrap: normal; }
    main table:not(.timing-table) { border-collapse: collapse; margin: 18px 0; font-variant-numeric: tabular-nums; }
    main table:not(.timing-table) th, main table:not(.timing-table) td { padding: 6px 14px 6px 0; border-bottom: 1px solid #dde2d9; text-align: left; vertical-align: top; }
    main table:not(.timing-table) tr:first-child th { border-bottom: 2px solid #c9cfc3; }
    main mjx-container { max-width: 100%; overflow-x: auto; overflow-y: hidden; }
    a { color: var(--accent); text-underline-offset: 3px; }
    details { font-size: 15px; color: var(--muted); margin-top: 26px; }
    summary { cursor: pointer; font-family: system-ui, sans-serif; }
    pre { overflow-x: auto; padding: 16px; background: #f1f3ee; border-radius: 4px; line-height: 1.6; }
    code { font: .85em/1.5 ui-monospace, monospace; }
    .research-entry + .research-entry { margin-top: 36px; padding-top: 28px; border-top: 1px solid #e2e5dd; }
    /* Keep off-screen entries out of layout/paint; native find and fragment links
       can still reveal them. Remember measured heights after visiting an entry. */
    .research-entry { content-visibility: auto; contain-intrinsic-size: auto 3000px; padding-left: 24px; margin-left: -24px; }
    .research-entry h3 { font-size: 24px; margin-bottom: 12px; }
    .entry-meta, .timing-note { color: var(--muted); font: 12px/1.6 system-ui, sans-serif; }
    .timing-table { width: 100%; border-collapse: collapse; margin-top: 24px; font: 14px/1.5 system-ui, sans-serif; }
    .timing-table caption { text-align: left; font-weight: 600; padding-bottom: 10px; }
    .timing-table th, .timing-table td { padding: 10px 12px; border-bottom: 1px solid #dde2d9; text-align: left; vertical-align: top; }
    .timing-table th:last-child, .timing-table .elapsed { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .timing-table tbody tr:first-child { background: #eef5ef; }
    /* Hover a heading to reveal a link to its anchor, as on rendered GitHub Markdown. */
    .heading-anchor { float: left; width: .9em; margin-left: -.9em; opacity: 0; color: var(--muted); font-family: system-ui, sans-serif; font-weight: 400; text-decoration: none; transition: opacity .15s ease; }
    .heading-anchor::before { content: '#'; }
    :is(h2, h3, h4):hover > .heading-anchor, .heading-anchor:focus-visible { opacity: 1; }
    .heading-anchor:hover { color: var(--accent); }
    @media (hover: none) { .heading-anchor { opacity: .35; } }
    footer { margin-top: 40px; color: var(--muted); font: 13px/1.6 system-ui, sans-serif; }
    .scroll-nav { position: fixed; z-index: 10; right: max(12px, env(safe-area-inset-right), calc((100% - var(--notebook-width)) / 2 - 60px)); top: 50%; transform: translateY(-50%); display: grid; gap: 8px; }
    .scroll-nav button { width: 44px; height: 44px; padding: 10px; border: 1px solid #c8d8ce; border-radius: 50%; background: var(--paper); color: var(--accent); box-shadow: 0 2px 8px #23372826; cursor: pointer; touch-action: manipulation; }
    .scroll-nav button[hidden] { display: block; visibility: hidden; }
    .scroll-nav button:hover { background: #eef5ef; }
    .scroll-nav button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .scroll-nav svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    @media (max-width: 640px) { body { font-size: 16px; } .toolbar { padding: 18px; flex-wrap: wrap; } main { margin: 0 10px 24px; padding: 30px 22px; } h2 { font-size: 24px; } .intro { font-size: 18px; } }
    /* Below this width there is not enough room for the stack beside the paper. */
    @media (max-width: 1083px) {
      .scroll-nav { opacity: 0; pointer-events: none; transition: opacity .2s ease; }
      .scroll-nav[data-active], .scroll-nav:has(:focus-visible) { opacity: .75; pointer-events: auto; }
      .search-toggle { opacity: .75; }
    }
    @media (prefers-reduced-motion: reduce) { .scroll-nav { transition: none; } }
    .search-toggle, .notebook-search { position: fixed; z-index: 20; font: 14px/1.5 system-ui, sans-serif; }
    .search-toggle { bottom: 18px; right: 18px; }
    .search-shortcut { display: none; }
    @media (any-hover: hover) and (any-pointer: fine) { .search-shortcut { display: inline; } }
    .search-toggle[data-keyboard] .search-shortcut { display: inline; }
    .notebook-search { top: 16px; right: 16px; width: min(560px, calc(100% - 32px)); max-height: 65vh; overflow: auto; padding: 18px; background: var(--paper); border: 1px solid #c8d8ce; border-radius: 8px; box-shadow: 0 8px 30px #23372833; }
    .notebook-search[hidden] { display: none; }
    .notebook-search input[type=search] { width: 100%; margin: 8px 0; padding: 10px; font: inherit; }
    .search-toggle, .notebook-search button { font: inherit; color: var(--accent); background: var(--paper); border: 1px solid #c8d8ce; border-radius: 5px; padding: 6px 10px; cursor: pointer; }
    .search-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .thread-navigation { max-width: 1100px; margin: 12px auto; padding: 0 18px; overflow-wrap: anywhere; }
    #search-close { margin-left: auto; }
    #search-results { padding: 0; list-style: none; }
    #search-results button { display: block; width: 100%; text-align: left; margin-top: 8px; overflow-wrap: anywhere; }
    #search-results strong, #search-results span { display: block; }
    #search-results span { color: var(--ink); white-space: pre-wrap; }
    .search-hit { outline: 2px solid var(--accent); outline-offset: 5px; background: #eef5ef; scroll-margin: 24px; }
    @media print { .search-toggle, .notebook-search { display: none; } .search-hit { outline: none; background: none; } }
    @media print { .research-entry { content-visibility: visible; } body { background: white; } .toolbar, details, footer, .scroll-nav, .heading-anchor { display: none; } main { border: 0; box-shadow: none; margin: 0; padding: 0; max-width: none; } .math { overflow: visible; } }
  </style>
  <script>
    // BEGIN NOTEBOOK SETTINGS
    window.notebookSettings = {mode: 'live', revisionUrl: '/revision', pollMs: 1000};
    // END NOTEBOOK SETTINGS
    window.MathJax = {
      // The viewport scheduler below supplies small explicit containers. ui/lazy
      // still scans the entire document, which is too costly for this record.
      tex: {
        inlineMath: [['\\(', '\\)'], ['$', '$']],
        displayMath: [['\\[', '\\]'], ['$$', '$$']],
        tags: 'ams',
        macros: { RR: '\\mathbb{R}', EE: '\\mathbb{E}' }
      },
      svg: { fontCache: 'global' },
      startup: {
        typeset: false,
        pageReady() {
          return MathJax.startup.defaultPageReady().then(() => {
            window.mathReady = true;
            window.startNotebookMath();
            document.getElementById('status').textContent = window.notebookSettings.mode === 'published'
              ? 'Published notebook' : 'Live · watching for changes';
            try {
              const scroll = sessionStorage.getItem('math-scroll');
              if (scroll !== null) {
                window.scrollTo(0, Number(scroll));
                sessionStorage.removeItem('math-scroll');
              }
            } catch (_) {}
          });
        }
      }
    };
  </script>
  <script id="mathjax" defer src="https://cdn.jsdelivr.net/npm/mathjax@4.0.0/tex-svg.js"></script>

<body>
  <header class="toolbar">
    <span><a class="brand" href="https://github.com/kbr-/math-research">Noemesis</a> · Research notebook</span>
    <span id="status" role="status">Loading math…</span>
  </header>
  <button id="update-notice" type="button" hidden title="Reload the updated notebook at the current position">Notebook updated · reload</button>
  <!-- THREAD SETTINGS -->
  <!-- THREAD NAVIGATION -->
  <main>
    <!-- NOTEBOOK -->
    <footer id="notebook-footer">Changes appear automatically. Right-click an equation for MathJax options.</footer>
  </main>
  <nav class="scroll-nav" aria-label="Notebook navigation">
    <button type="button" data-scroll="top" aria-label="Scroll to top" title="Scroll to top" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 11 6-6 6 6M6 19l6-6 6 6"/></svg></button>
    <button type="button" data-scroll="previous" aria-label="Previous section" title="Previous section" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg></button>
    <button type="button" data-scroll="next" aria-label="Next section" title="Next section" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <button type="button" data-scroll="end" aria-label="Scroll to end" title="Scroll to end" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 5 6 6 6-6M6 13l6 6 6-6"/></svg></button>
  </nav>
  <button class="search-toggle" id="search-open" type="button" aria-controls="notebook-search" aria-expanded="false">Search notebook<span class="search-shortcut"> (/)</span></button>
  <aside class="notebook-search" id="notebook-search" aria-label="Search notebook" hidden>
    <div class="search-controls"><label for="search-query"><strong>Search text or TeX</strong></label><button id="search-close" type="button" aria-label="Close search">Close</button></div>
    <input id="search-query" type="search" placeholder="Words or TeX, e.g. \mathcal" autocomplete="off" spellcheck="false" aria-describedby="search-status">

  <script id="viewport-math">
    // Preserve only blocks that MathJax actually changes. Search builds the rest
    // of its text index on demand, without reading layout or typesetting anything.
    window.notebookText = {
      selector: 'p, li, .math, .math-fragment, h1, h2, h3, h4, h5, h6, td, th, summary',
      sources: new WeakMap(),
      pause: () => new Promise(resolve => setTimeout(resolve, 0))
    };
    // Older entries also contain TeX directly between paragraphs. Give those
    // text nodes small observable containers without rewriting their contents
    // or typesetting a whole article. Inline wrappers preserve mixed prose.
    window.notebookText.wrapBareMath = element => {
      const {selector} = window.notebookText;
      if (element.closest(selector + ', pre, code, script, style, textarea, noscript, mjx-container')) return;
      for (const node of [...element.childNodes]) {
        if (node.nodeType !== Node.TEXT_NODE || !/\\[([]|\$/.test(node.textContent)) continue;
        const wrapper = document.createElement('span');
        wrapper.className = 'math-fragment';
        node.replaceWith(wrapper);
        wrapper.append(node);
      }
    };
    // Only nearby regions acquire block observers; only nearby blocks reach MathJax.
    // Keep the full source in the DOM for native find, anchor links and no-JS reading.
    window.startNotebookMath = () => {
      const pending = new Set();
      const finished = new WeakSet();
      const blocksByRegion = new WeakMap();
      let running = false;
      const {selector, sources, pause, wrapBareMath} = window.notebookText;
      const hasMath = element => /\\[([]|\$/.test(element.textContent);

      async function drain() {
        if (running) return;
        running = true;
        try {
          while (pending.size) {
            const block = pending.values().next().value;
            pending.delete(block);
            if (finished.has(block)) continue;
            // One paragraph/display per task, so input can run between chunks.
            if (!sources.has(block)) sources.set(block, block.textContent);
            await MathJax.typesetPromise([block]);
            window.dispatchEvent(new Event('notebook-math-rendered'));
            finished.add(block);
            blockObserver.unobserve(block);
            await pause();
          }
        } catch (error) {
          window.mathError = true;
          const status = document.getElementById('status');
          status.textContent = 'Some math could not render. Refresh to retry.';
          status.dataset.error = '';
          console.error(error);
        } finally { running = false; }
      }
      const blockObserver = new IntersectionObserver(entries => {
        for (const {target, isIntersecting} of entries) {
          if (isIntersecting && !finished.has(target)) pending.add(target);
          else pending.delete(target);
        }
        void drain();
      }, {rootMargin: '600px 0px'});
      const regionObserver = new IntersectionObserver(entries => {
        for (const {target: region, isIntersecting} of entries) {
          let blocks = blocksByRegion.get(region);
          if (isIntersecting && !blocks) {
            wrapBareMath(region);
            for (const element of region.querySelectorAll('*')) wrapBareMath(element);
            blocks = region.matches(selector) ? [region] :
              [...region.querySelectorAll(selector)].filter(block =>
                !block.parentElement.closest(selector) ||
                !region.contains(block.parentElement.closest(selector)));
            blocks = blocks.filter(hasMath);
            blocksByRegion.set(region, blocks);
          }
          for (const block of blocks || []) {
            if (isIntersecting && !finished.has(block)) blockObserver.observe(block);
            else { blockObserver.unobserve(block); pending.delete(block); }
          }
        }
      }, {rootMargin: '1200px 0px'});
      for (const parent of document.querySelectorAll('main, #research-record')) wrapBareMath(parent);
      for (const region of document.querySelectorAll(
        'main > :not(#research-record), #research-record > *')) {
        regionObserver.observe(region);
      }
    };
  </script>
  <script id="notebook-search-client">
    (() => {
      const {selector, sources, pause} = window.notebookText;
      const panel = document.getElementById('notebook-search');
      const opener = document.getElementById('search-open');
      const input = document.getElementById('search-query');
      const matchCase = document.getElementById('search-case');
      const scope = document.getElementById('search-scope');
      const thread = window.notebookThread || {name: 'main', title: 'Main notebook', catalogue: './notebooks.json'};
      let allPromise;
      const status = document.getElementById('search-status');
      const results = document.getElementById('search-results');
      const previous = document.getElementById('search-previous');
      const next = document.getElementById('search-next');
      const normalize = text => text.replace(/\s+/g, ' ').trim();
      const pageSize = 30;
      let indexPromise, matches = [], page = 0, generation = 0, timer, highlighted;

      function buildIndex() {
        if (indexPromise) return indexPromise;
        indexPromise = (async () => {
          performance.mark('notebook-search-index-start');
          const index = [];
          const stack = [...document.querySelector('main').children].reverse();
          const titles = new WeakMap();
          while (stack.length) {
            const deadline = performance.now() + 8;
            do {
              const element = stack.pop();
              if (element.matches('script, style, footer, .heading-anchor, mjx-container')) continue;
              window.notebookText.wrapBareMath(element);
              if (element.matches(selector + ', pre') || !element.querySelector(selector + ', pre')) {
                const text = normalize(sources.get(element) ?? element.textContent);
                if (!text) continue;
                const region = element.closest('article, section');
                if (region && !titles.has(region)) {
                  const heading = region.querySelector('h2, h3');
                  titles.set(region, heading ? normalize(sources.get(heading) ?? heading.textContent) : 'Notebook');
                }
                index.push({element, text, lower: text.toLowerCase(), title: titles.get(region) || 'Overview'});
              } else {
                for (let n = element.children.length - 1; n >= 0; n--) stack.push(element.children[n]);
              }
            } while (stack.length && performance.now() < deadline);
            if (stack.length) await pause();
          }
          performance.measure('notebook-search-index', 'notebook-search-index-start');
          return index;
        })();
        return indexPromise;
      }
      async function allIndex() {
        if (allPromise) return allPromise;
        allPromise = (async () => {
          const catalogueUrl = new URL(thread.catalogue, location.href);
          const response = await fetch(catalogueUrl);
          if (!response.ok) throw new Error('Cannot load notebook directory');
          const notebooks = await response.json();
          const records = (await buildIndex()).map(r => ({...r, title: thread.title + ' · ' + r.title}));
          for (const notebook of notebooks) {
            if (notebook.name === thread.name) continue;
            const response = await fetch(new URL(notebook.source, catalogueUrl));
            if (!response.ok) throw new Error('Cannot load ' + notebook.title);
            const doc = new DOMParser().parseFromString(await response.text(), 'text/html');
            // Detached source is never inserted/typeset. Index complete sections/articles,
            // retaining original TeX and navigable source anchors.
            let deadline = performance.now() + 8;
            for (const region of doc.querySelectorAll('section:not(#research-record), article')) {
              const text = normalize(region.textContent);
              const heading = region.querySelector('h2, h3');
              records.push({text, lower: text.toLowerCase(), title: notebook.title + ' · ' + (heading?.textContent || 'Overview'),
                url: new URL(notebook.url + '#' + encodeURIComponent(region.id), catalogueUrl).href});
              if (performance.now() >= deadline) { await pause(); deadline = performance.now() + 8; }
            }
            const intro = [...doc.body.children].filter(e => !e.matches('section')).map(e => e.textContent).join(' ');
            if (intro.trim()) records.push({text: normalize(intro), lower: normalize(intro).toLowerCase(), title: notebook.title + ' · Overview', url: new URL(notebook.url, catalogueUrl).href});
          }
          return records;
        })().catch(error => { allPromise = null; throw error; });
        return allPromise;
      }
      function close() {
        panel.hidden = true;
        opener.setAttribute('aria-expanded', 'false');
        clearTimeout(timer);
        generation++;
      }
      function showResults() {
        results.replaceChildren();
        const start = page * pageSize;
        for (const {record, position, length} of matches.slice(start, start + pageSize)) {
          const item = document.createElement('li');
          const button = document.createElement('button');
          button.type = 'button';
          const title = document.createElement('strong');
          title.textContent = record.title;
          const excerpt = document.createElement('span');
          const from = Math.max(0, position - 70), to = Math.min(record.text.length, position + length + 110);
          excerpt.textContent = (from ? '…' : '') + record.text.slice(from, to) + (to < record.text.length ? '…' : '');
          button.append(title, excerpt);
          button.addEventListener('click', () => {
            close();
            if (record.url) { location.href = record.url; return; }
            highlighted?.classList.remove('search-hit');
            highlighted = record.element;
            highlighted.classList.add('search-hit');
            // Search can find text inside a closed disclosure too.
            for (let parent = highlighted.parentElement; parent; parent = parent.parentElement) {
              if (parent.matches('details')) parent.open = true;
            }
            highlighted.scrollIntoView({block: 'center', behavior: 'instant'});
            const tabIndex = highlighted.getAttribute('tabindex');
            highlighted.tabIndex = -1;
            highlighted.focus({preventScroll: true});
            highlighted.addEventListener('blur', () => {
              if (tabIndex === null) record.element.removeAttribute('tabindex');
              else record.element.setAttribute('tabindex', tabIndex);
            }, {once: true});
          });
          item.append(button);
          results.append(item);
        }
        previous.disabled = page === 0;
        next.disabled = start + pageSize >= matches.length;
        status.textContent = matches.length
          ? `${matches.length} matching passages · ${start + 1}–${Math.min(start + pageSize, matches.length)}`
          : 'No matching passages.';
        status.dataset.state = 'ready';
      }
      async function search() {
        const run = ++generation;
        const query = normalize(input.value);
        results.replaceChildren();
        previous.disabled = next.disabled = true;
        if (!query) {
          status.textContent = 'Search the entire notebook, including unvisited equations.';
          status.dataset.state = 'idle';
          return;
        }
        status.dataset.state = 'searching';
        status.textContent = indexPromise ? 'Searching…' : 'Preparing search…';
        let records;
        try { records = await (scope.value === 'all' ? allIndex() : buildIndex()); }
        catch (error) { if (run === generation) { status.textContent = error.message; status.dataset.state = 'error'; } return; }
        if (run !== generation || panel.hidden) return;
        const started = performance.now();
        const sensitive = matchCase.checked;
        const needle = sensitive ? query : query.toLowerCase();
        const found = [];
        for (let n = 0; n < records.length;) {
          const deadline = performance.now() + 8;
          do {
            const record = records[n++];
            const position = (sensitive ? record.text : record.lower).indexOf(needle);
            if (position !== -1) found.push({record, position, length: query.length});
          } while (n < records.length && performance.now() < deadline);
          if (n < records.length) await pause();
          if (run !== generation || panel.hidden) return;
        }
        matches = found;
        page = 0;
        showResults();
        performance.measure('notebook-search-query', {start: started});
      }
      function schedule() {
        generation++; // Invalidate old results immediately, before the debounce.
        clearTimeout(timer);
        results.replaceChildren();
        previous.disabled = next.disabled = true;
        status.dataset.state = 'pending';
        timer = setTimeout(() => { void search(); }, 150);
      }
      opener.addEventListener('click', () => {
        panel.hidden = false;
        opener.setAttribute('aria-expanded', 'true');
        input.focus();
        if (input.value && status.dataset.state !== 'ready') schedule();
      });
      document.getElementById('search-close').addEventListener('click', () => { close(); opener.focus(); });
      input.addEventListener('input', schedule);
      matchCase.addEventListener('change', schedule);
      scope.addEventListener('change', schedule);
      input.addEventListener('keydown', event => {
        if (event.key === 'Enter') { clearTimeout(timer); void search(); }
      });
      previous.addEventListener('click', () => { page--; showResults(); });
      next.addEventListener('click', () => { page++; showResults(); });
      window.addEventListener('keydown', event => {
        if (!event.target.closest('input, textarea, select, [contenteditable]')) opener.dataset.keyboard = '';
        if (event.key === 'Escape' && !panel.hidden) { close(); opener.focus(); }
        if (event.key === '/' && !event.ctrlKey && !event.metaKey && !event.altKey &&
            !event.target.closest('input, textarea, select, [contenteditable]')) {
          event.preventDefault();
          opener.click();
        }
      });
    })();
  </script>
  <script>
    // Give every addressable heading a hover link. A heading without its own id uses the id
    // of the section or article it opens.
    for (const heading of document.querySelectorAll('main h2, main h3, main h4')) {
      const parent = heading.parentElement;
      const opensParent = parent && parent.id && parent.matches('section, article') &&
        parent.querySelector('h2, h3, h4') === heading;
      const id = heading.id || (opensParent ? parent.id : '');
      if (!id) continue;
      const link = document.createElement('a');
      link.className = 'heading-anchor';
      link.href = '#' + id;
      link.setAttribute('aria-label', 'Link to this heading');
      heading.prepend(link);
    }
  </script>
  <script>
    (() => {
      const navigation = document.querySelector('.scroll-nav');
      const headings = [...document.querySelectorAll('main h2, main h3')];
      const buttons = Object.fromEntries([...document.querySelectorAll('[data-scroll]')]
        .map(button => [button.dataset.scroll, button]));
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let targets = {};
      let pending = false;
      let destination = null;
      let destinationTop = null;
      let hideTimer;

      function showNavigation() {
        navigation.dataset.active = '';
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => { delete navigation.dataset.active; }, 3500);
      }

      function destinationPosition() {
        const end = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
        if (destination === 'end') return end;
        if (destination === 'top') return 0;
        return Math.min(end, Math.max(0,
          destination.getBoundingClientRect().top + window.scrollY - 16));
      }

      function update() {
        pending = false;
        const y = window.scrollY;
        const end = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
        // Headings are in document order. Binary search avoids forcing layout for
        // every off-screen entry on every scroll frame.
        let low = 0, high = headings.length;
        while (low < high) {
          const middle = (low + high) >>> 1;
          const heading = headings[middle];
          const box = heading.parentElement?.matches('.research-entry')
            ? heading.parentElement : heading;
          const position = box.getBoundingClientRect().top + y - 16;
          if (position <= y + 2) low = middle + 1;
          else high = middle;
        }
        const current = low - 1;
        targets = {
          top: y > 2 ? 0 : null,
          previous: current > 0 ? headings[current - 1] : null,
          next: current + 1 < headings.length && y < end - 2
            ? headings[current + 1] : null,
          end: y < end - 2 ? end : null
        };
        for (const [name, button] of Object.entries(buttons)) {
          button.hidden = targets[name] === null;
        }
      }

      function measure() {
        // Keep the chosen heading or page edge aligned as lazy math changes height.
        // Only correct a moved destination, so ordinary smooth scrolling can finish.
        if (destination !== null) {
          const top = destinationPosition();
          if (Math.abs(top - destinationTop) > 1) {
            destinationTop = top;
            window.scrollTo({ top, behavior: 'instant' });
          }
        }
        update();
      }

      function settleDestination() {
        if (destination !== null) {
          destinationTop = destinationPosition();
          // Scroll anchoring or a smooth-scroll endpoint can change the viewport
          // without changing the destination's absolute document coordinate.
          if (Math.abs(window.scrollY - destinationTop) > 1) {
            window.scrollTo({ top: destinationTop, behavior: 'instant' });
          }
        }
        update();
      }

      for (const [name, button] of Object.entries(buttons)) {
        button.addEventListener('click', () => {
          showNavigation();
          settleDestination();
          measure();
          if (targets[name] !== null) {
            destination = name === 'top' || name === 'end' ? name : targets[name];
            destinationTop = destinationPosition();
            window.scrollTo({
              top: destinationTop, behavior: reducedMotion.matches ? 'instant' : 'smooth'
            });
          }
        });
      }
      window.addEventListener('scroll', () => {
        showNavigation();
        if (!pending) { pending = true; requestAnimationFrame(update); }
      }, { passive: true });
      window.addEventListener('resize', measure);
      window.addEventListener('scrollend', settleDestination);
      window.addEventListener('notebook-math-rendered', measure);
      const releaseDestination = () => { destination = null; };
      for (const event of ['wheel', 'hashchange']) {
        window.addEventListener(event, releaseDestination, { passive: true });
      }
      for (const event of ['pointerdown', 'touchstart']) {
        window.addEventListener(event, event => {
          if (!event.target.closest('.scroll-nav')) releaseDestination();
        }, { passive: true });
      }
      window.addEventListener('keydown', event => {
        if (['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Home', 'End', ' ', 'Tab'].includes(event.key)) {
          releaseDestination();
        }
      });
      // MathJax and font loading can move headings after the initial render.
      new ResizeObserver(measure).observe(document.querySelector('main'));
      measure();
    })();
  </script>
  <script>
    const status = document.getElementById('status');
    const settings = window.notebookSettings;
    document.getElementById('mathjax').addEventListener('error', () => {
      status.textContent = 'Math could not load. Check your internet connection and refresh.';
      status.dataset.error = '';
    });
    const updateNotice = document.getElementById('update-notice');
    updateNotice.addEventListener('click', () => {
      try { sessionStorage.setItem('math-scroll', String(window.scrollY)); } catch (_) {}
      location.reload();
    });
    async function watch() {
      try {
        const endpoint = new URL(settings.revisionUrl, window.location.href);
        if (settings.mode === 'published') endpoint.searchParams.set('_', String(Date.now()));
        const response = await fetch(endpoint, { cache: 'no-store', signal: AbortSignal.timeout(4000) });
        if (!response.ok) throw new Error('Server unavailable');
        const { revision } = await response.json();
        if (typeof revision !== 'string') throw new Error('Invalid revision');
        // Never reload by itself: an automatic reload interrupts reading while agents edit.
        // The local server offers a reload instead, keeping the position; Pages shows nothing.
        updateNotice.hidden = settings.mode !== 'live' || revision === '__REVISION__';
        if (window.mathReady && !window.mathError) {
          status.textContent = settings.mode === 'published' ? 'Published notebook' : 'Live · watching for changes';
          delete status.dataset.error;
        }
      } catch (_) {
        if (settings.mode === 'live') {
          status.textContent = 'Server disconnected · reconnecting…';
          status.dataset.error = '';
        }
      }
      setTimeout(watch, settings.pollMs);
    }
    watch();
  </script>
</body>
</html>
