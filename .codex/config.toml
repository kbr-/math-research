# Shared context defaults for CLI and remote sessions in this project.
# start-session.sh applies the shared start-codex.sh constants over the Unix socket.
model_context_window = 600000
model_auto_compact_token_limit = 550000
# Keep the complete shared and branch-specific AGENTS.md instructions in native context.
project_doc_max_bytes = 65536

[agents]
max_concurrent_threads_per_session = 6

[features]
hooks = true
