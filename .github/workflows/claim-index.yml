name: Validate structured claim index

on:
  push:
    paths:
      - 'research/claims/**'
      - research/CLAIM_INDEX.md
      - notebook.html
      - research/branches/**
      - tools/notebooks.py
      - tools/notebook_site.py
      - tools/branch.py
      - 'formalization/**/*.lean'
      - tools/claim_registry.py
      - tools/claim_reviews.py
      - tools/claim_views.py
      - tools/claim_authoring.py
      - tools/fossick.py
      - tools/tests/test_fossick.py
      - tools/claim_attention.py
      - tools/resume.py
      - tools/claim-attention.py
      - tools/tests/test_claim_attention.py
      - research/ATTENTION.md
      - tools/claim_notices.py
      - tools/claim_evidence.py
      - tools/record_citations.py
      - tools/tests/test_record_citations.py
      - tools/tests/test_claim_views.py
      - tools/tests/test_claim_authoring.py
      - tools/tests/test_claim_notices.py
      - tools/tests/test_claim_article_evidence.py
      - tools/tests/test_claim_article_finalizer.py
      - tools/tests/test_finish_turn.py
      - tools/claim_graph.py
      - tools/claim_maintenance.py
      - tools/claim_registration.py
      - tools/tests/test_claim_registration.py
      - tools/tests/test_claim_maintenance.py
      - tools/finish-turn.py
      - compute.sh
      - tools/recovery_evidence.py
      - tools/notebook-excerpt.py
      - tools/notebook_context.py
      - research/context-budgets.json
      - tools/tests/test_claim_graph.py
      - tools/claim-dependencies.py
      - tools/claim-index.py
      - tools/search-claims.py
      - tools/merge-formalization-appends.py
      - 'tools/tests/test_claim_registry.py'
      - 'tools/tests/test_claim_dependencies.py'
      - 'tools/tests/test_merge_formalization_appends.py'
      - .github/workflows/claim-index.yml
  pull_request:
    paths:
      - 'research/claims/**'
      - research/CLAIM_INDEX.md
      - notebook.html
      - research/branches/**
      - tools/notebooks.py
      - tools/notebook_site.py
      - tools/branch.py
      - 'formalization/**/*.lean'
      - 'tools/**'
      - .github/workflows/claim-index.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 tools/claim-index.py validate
      - run: python3 tools/claim-attention.py check
      - run: python3 -m unittest discover -s tools/tests -p test_claim_attention.py
      - run: python3 -m unittest discover -s tools/tests -p test_fossick.py
      - run: python3 -m unittest discover -s tools/tests -p test_claim_registry.py
      - run: python3 -m unittest discover -s tools/tests -p test_claim_views.py
      - run: python3 -m unittest discover -s tools/tests -p test_claim_authoring.py
      - run: python3 -m unittest discover -s tools/tests -p test_claim_notices.py
      - run: python3 -m unittest discover -s tools/tests -p test_claim_article_evidence.py
      - run: python3 -m unittest discover -s tools/tests -p test_claim_article_finalizer.py
      - run: python3 -m unittest discover -s tools/tests -p test_finish_turn.py
      - run: python3 -m unittest discover -s tools/tests -p test_record_citations.py
      - run: python3 -m unittest discover -s tools/tests -p test_claim_dependencies.py
      - run: python3 -m unittest discover -s tools/tests -p test_claim_graph.py
      - run: python3 tools/claim-index.py graph audit
      - run: python3 -m unittest discover -s tools/tests -p test_merge_formalization_appends.py
      - run: python3 -m unittest discover -s tools/tests -p test_claim_maintenance.py
      - run: python3 -m unittest discover -s tools/tests -p test_claim_registration.py
      - name: Check changed-claim maintenance contract
        env:
          CLAIM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$CLAIM_BASE" || "$CLAIM_BASE" =~ ^0+$ ]]; then
            CLAIM_BASE=EMPTY
          fi
          python3 tools/claim-index.py changed --base "$CLAIM_BASE"
