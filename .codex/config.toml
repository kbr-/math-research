default_permissions = "math"
# Keep the complete shared and branch-specific AGENTS.md instructions in native context.
project_doc_max_bytes = 65536

[agents]
max_concurrent_threads_per_session = 6

[features]
hooks = true

# A directory grant avoids the native sandbox's failure on individual file roots.
[permissions.math]
extends = ":workspace"

[permissions.math.filesystem]
"~/dev/math/.shared-run-files" = "write"
